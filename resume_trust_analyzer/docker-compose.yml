services:
  db:
    image: postgres:16
    container_name: resume_trust_db
    environment:
      POSTGRES_DB: resume_trust
      POSTGRES_USER: resume_user
      POSTGRES_PASSWORD: resume_password
    ports:
      - "5432:5432"
    volumes:
      - resume_trust_pgdata:/var/lib/postgresql/data

  backend:
    build: ./backend
    container_name: resume_trust_backend
    environment:
      DATABASE_URL: postgresql://resume_user:resume_password@db:5432/resume_trust
      APP_ENV: docker
      CORS_ORIGINS: http://localhost:5173,http://127.0.0.1:5173
    ports:
      - "8000:8000"
    depends_on:
      - db

  frontend:
    build: ./frontend
    container_name: resume_trust_frontend
    environment:
      VITE_API_URL: http://localhost:8000
    ports:
      - "5173:5173"
    depends_on:
      - backend

volumes:
  resume_trust_pgdata:
